# Theme
remote_theme: just-the-docs/just-the-docs

# Site Configuration
title: Thea The Awakening
description: Game notes and guides for Thea The Awakening

# URL Configuration (for GitHub Pages)
url: "https://massimiliano-devivo.github.io"
baseurl: "/gaming_notes_thea_the_awakening"

# Navigation
nav_external_links:
  - title: GitHub Repository
    url: https://github.com/massimiliano-devivo/gaming_notes_thea_the_awakening
    opens_in_new_tab: true

# Search
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/

# Color scheme (optional - default is light)
color_scheme: dark

# Back to top link
back_to_top: true
back_to_top_text: "Back to top"

# Footer content
footer_content: "Thea The Awakening Game Notes"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
